<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>{% block title %}MPPCR — MS Project Check &amp; Risk{% endblock %}</title>
<style>
  /* ---------- Système de design (jetons) ---------- */
  :root{
    --bg:#f6f7f9;
    --surface:#ffffff;
    --surface-2:#fbfcfd;
    --border:#e3e6ea;
    --border-strong:#d0d4da;

    --text:#16181d;
    --text-2:#4b5563;
    --text-3:#8a94a3;

    --brand:#2456e6;
    --brand-600:#1c46c4;
    --brand-soft:#eef3ff;

    --ok:#1a9e5c;   --ok-soft:#e6f7ee;
    --err:#d14343;  --err-soft:#fdecec;
    --warn:#c77d0a; --warn-soft:#fdf3e3;
    --info:#2456e6; --info-soft:#eef3ff;
    --na:#8a94a3;   --na-soft:#eef0f3;

    --radius:12px;
    --radius-sm:8px;
    --shadow-sm:0 1px 2px rgba(16,24,40,.05);
    --shadow:0 1px 3px rgba(16,24,40,.08),0 4px 16px rgba(16,24,40,.06);

    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:"SF Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }

  *,*::before,*::after{box-sizing:border-box;}

  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--font);
    font-size:15px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }

  a{color:var(--brand);}
  h1,h2,h3{margin:0;letter-spacing:-.01em;line-height:1.2;}
  p{margin:0;}
  code,pre,.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums;}

  .wrap{width:100%;max-width:1080px;margin:0 auto;padding:0 24px;}
  .main{padding:28px 24px 72px;}
  .sprite{position:absolute;width:0;height:0;overflow:hidden;}
  fieldset{border:0;margin:0;padding:0;min-width:0;}

  /* ---------- Topbar ---------- */
  .topbar{
    position:sticky;top:0;z-index:30;
    background:rgba(255,255,255,.92);
    -webkit-backdrop-filter:saturate(180%) blur(8px);
    backdrop-filter:saturate(180%) blur(8px);
    border-bottom:1px solid var(--border);
  }
  .topbar-inner{display:flex;align-items:center;gap:16px;min-height:64px;}
  .brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;}
  .mark{
    width:32px;height:32px;border-radius:9px;flex:none;
    background:linear-gradient(135deg,#4d7cff 0%,var(--brand) 55%,#16327f 100%);
    box-shadow:0 1px 2px rgba(16,24,40,.18),inset 0 1px 0 rgba(255,255,255,.35);
  }
  .brand-text{display:flex;flex-direction:column;line-height:1.15;}
  .brand-name{font-weight:750;font-size:1.02rem;letter-spacing:-.01em;}
  .brand-sub{color:var(--text-3);font-size:.78rem;font-weight:500;}
  .topbar-actions{margin-left:auto;display:flex;align-items:center;gap:10px;}

  /* ---------- En-tête de page ---------- */
  .page-head{margin:6px 0 22px;}
  .app-tag{font-size:.82rem;color:var(--text-3);font-weight:600;letter-spacing:.02em;margin-bottom:8px;}
  .app-tag b{color:var(--text);font-weight:750;}
  .doc-title{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  h1.filename{
    font-family:var(--mono);font-variant-numeric:tabular-nums;
    font-size:clamp(1.25rem,2.6vw,1.6rem);font-weight:650;
    word-break:break-word;
  }
  h1.page-title{font-size:clamp(1.35rem,3vw,1.75rem);font-weight:750;}
  .meta-line{margin-top:8px;color:var(--text-2);font-size:.9rem;}
  .head-actions{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap;}

  /* ---------- Cartes ---------- */
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow-sm);
    padding:22px;
    margin-bottom:18px;
  }
  .card > * + *{margin-top:16px;}
  .section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .section-head h2{font-size:1.06rem;font-weight:750;}
  .section-sub{color:var(--text-2);font-size:.88rem;margin-top:4px;}
  .rule{border:0;border-top:1px solid var(--border);margin:20px 0;}
  .block{display:grid;gap:12px;}
  .pre-line{white-space:pre-line;}
  .note{color:var(--text-2);font-size:.86rem;}
  .note-3{color:var(--text-3);font-size:.82rem;}

  /* ---------- Boutons ---------- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    font:inherit;font-weight:650;font-size:.9rem;
    padding:10px 18px;border-radius:var(--radius-sm);
    background:var(--brand);color:#fff;border:1px solid var(--brand);
    text-decoration:none;cursor:pointer;
  }
  .btn:hover{background:var(--brand-600);border-color:var(--brand-600);}
  .btn-ghost{background:var(--surface);color:var(--text);border-color:var(--border-strong);}
  .btn-ghost:hover{background:var(--surface-2);border-color:var(--text-3);}
  .btn-block{width:100%;padding:13px 18px;font-size:.95rem;}

  /* ---------- Badges (pilule + pastille) ---------- */
  .b{
    display:inline-flex;align-items:center;gap:7px;
    padding:4px 11px;border-radius:999px;
    font-size:.78rem;font-weight:700;white-space:nowrap;line-height:1.5;
    background:var(--na-soft);color:var(--text-2);
  }
  .b::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none;}
  .b-ok{background:var(--ok-soft);color:#0f7042;}
  .b-err{background:var(--err-soft);color:#a52f2f;}
  .b-warn{background:var(--warn-soft);color:#8f5a06;}
  .b-info{background:var(--info-soft);color:var(--brand-600);}
  .b-na{background:var(--na-soft);color:#6b7480;}
  .b-plain{padding:4px 11px;}
  /* Alias : classes produites par app.py (KIND_CSS / status_css). */
  .badge-ok{background:var(--ok-soft);color:#0f7042;}
  .badge-ko{background:var(--err-soft);color:#a52f2f;}
  .badge-info{background:var(--info-soft);color:var(--brand-600);}
  .badge-na{background:var(--na-soft);color:#6b7480;}
  .status{display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:999px;font-size:.78rem;font-weight:700;white-space:nowrap;}
  .status::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none;}
  .status-ok{background:var(--ok-soft);color:#0f7042;}
  .status-ko{background:var(--err-soft);color:#a52f2f;}
  .status-na{background:var(--na-soft);color:#6b7480;}

  /* ---------- Callouts (icône + fond) ---------- */
  .c{
    display:flex;gap:12px;align-items:flex-start;
    padding:14px 16px;border-radius:var(--radius-sm);
    border:1px solid var(--border);background:var(--surface-2);
    font-size:.9rem;color:var(--text-2);
  }
  .c-ico{width:17px;height:17px;flex:none;margin-top:2px;}
  .c strong{display:block;color:var(--text);font-size:.88rem;margin-bottom:2px;}
  .c p + p{margin-top:6px;}
  .c-err{background:var(--err-soft);border-color:#f3cdcd;color:#7d2b2b;}
  .c-err strong,.c-err .c-ico{color:#a52f2f;}
  .c-err .c-ico{fill:#a52f2f;}
  .c-warn{background:var(--warn-soft);border-color:#f0dcb4;color:#7a5208;}
  .c-warn strong,.c-warn .c-ico{color:#8f5a06;}
  .c-warn .c-ico{fill:#8f5a06;}
  .c-info{background:var(--info-soft);border-color:#dbe4ff;color:#2b3a63;}
  .c-info strong,.c-info .c-ico{color:var(--brand-600);}
  .c-info .c-ico{fill:var(--brand-600);}
  .c-ok{background:var(--ok-soft);border-color:#c7ead7;color:#14603a;}
  .c-ok strong,.c-ok .c-ico{color:#0f7042;}
  .c-ok .c-ico{fill:#0f7042;}
  .c-actions{margin-top:8px;}
  .c-action{
    margin-top:8px;padding-left:12px;border-left:2px solid currentColor;
    font-size:.86rem;opacity:.95;
  }

  /* ---------- KPI (grille de cartes, liseré gauche) ---------- */
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;}
  .kpi{
    background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--info);
    border-radius:var(--radius-sm);padding:14px 16px;
  }
  .kpi-label{font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3);}
  .kpi-value{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:1.5rem;font-weight:650;margin-top:6px;line-height:1.1;}
  .kpi-sub{color:var(--text-3);font-size:.78rem;margin-top:2px;}
  .kpi.is-ok,.kpi-ok{border-left-color:var(--ok);}
  .kpi.is-ko,.kpi-ko,.kpi-alert{border-left-color:var(--err);}
  .kpi.is-warn,.kpi-warn{border-left-color:var(--warn);}
  .kpi.is-na,.kpi-na{border-left-color:var(--na);}
  .kpi.is-info,.kpi-info{border-left-color:var(--info);}

  /* ---------- Priorités d'amélioration ---------- */
  .prios{display:grid;gap:0;}
  .prio{
    display:grid;grid-template-columns:44px 1fr;gap:14px;
    padding:16px 0;border-top:1px solid var(--border);
  }
  .prio:first-child{border-top:0;padding-top:4px;}
  .prio-num{
    font-family:var(--mono);font-variant-numeric:tabular-nums;
    font-size:1rem;font-weight:650;color:var(--text-3);
    display:flex;align-items:center;gap:7px;
  }
  .prio-num::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--na);flex:none;}
  .prio.is-ko .prio-num{color:var(--err);}
  .prio.is-ko .prio-num::before{background:var(--err);}
  .prio.is-na .prio-num{color:var(--text-3);}
  .prio.is-na .prio-num::before{background:var(--na);}
  .prio.is-info .prio-num::before{background:var(--info);}
  .prio-title-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .prio-title{font-weight:700;font-size:.95rem;}
  .prio-metric{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.82rem;color:var(--text-2);white-space:nowrap;}
  .prio-action{
    margin-top:8px;padding-left:12px;border-left:2px solid var(--border-strong);
    color:var(--text-2);font-size:.89rem;
  }

  /* ---------- Tableaux ---------- */
  .table-wrap{border:1px solid var(--border);border-radius:var(--radius-sm);overflow-x:auto;background:var(--surface);}
  table.tbl{width:100%;border-collapse:collapse;min-width:860px;}
  table.tbl thead th{
    background:var(--surface-2);text-align:left;
    padding:11px 14px;border-bottom:1px solid var(--border);
    font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3);
  }
  table.tbl td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:top;font-size:.88rem;}
  table.tbl tbody tr:last-child td{border-bottom:0;}
  table.tbl tbody tr:hover td{background:var(--surface-2);}
  table.tbl .num,table.tbl .target{text-align:right;white-space:nowrap;font-family:var(--mono);font-variant-numeric:tabular-nums;}
  table.tbl .detail{display:block;color:var(--text-3);font-size:.78rem;}
  table.tbl .comment{color:var(--text-2);min-width:220px;}
  table.tbl td.is-ko:first-child{box-shadow:inset 3px 0 0 var(--err);}
  table.tbl td.is-na:first-child{box-shadow:inset 3px 0 0 var(--na);}

  /* ---------- Sortie brute ---------- */
  details.raw{border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);}
  details.raw > summary{
    padding:12px 16px;cursor:pointer;font-weight:650;font-size:.86rem;color:var(--text-2);
    list-style:none;
  }
  details.raw > summary::-webkit-details-marker{display:none;}
  details.raw > summary::before{content:"▸";display:inline-block;width:14px;color:var(--text-3);transition:transform .15s ease;}
  details.raw[open] > summary::before{content:"▾";}
  details.raw > summary:hover{color:var(--text);}
  details.raw pre{
    margin:0;padding:16px;border-top:1px solid var(--border);
    background:#0f1420;color:#e6eaf2;border-radius:0 0 var(--radius-sm) var(--radius-sm);
    font-size:.78rem;line-height:1.5;white-space:pre-wrap;word-break:break-word;
    max-height:520px;overflow:auto;
  }

  /* ---------- Formulaire ---------- */
  .field + .field{margin-top:20px;}
  .field-label{display:block;font-weight:700;font-size:.88rem;margin-bottom:8px;}
  .field-hint{display:block;margin-top:6px;color:var(--text-3);font-size:.8rem;}
  .drop{
    border:1.5px dashed var(--border-strong);border-radius:var(--radius-sm);
    background:var(--surface-2);padding:18px;transition:border-color .15s ease,background .15s ease;
  }
  .drop:hover,.drop:focus-within{border-color:var(--brand);background:var(--brand-soft);}
  .drop-body{display:flex;flex-direction:column;gap:10px;}
  .drop-title{font-weight:700;font-size:.9rem;}
  .drop-title span{color:var(--text-3);font-weight:500;}
  input[type="file"]{
    width:100%;font:inherit;font-size:.85rem;color:var(--text-2);
    padding:10px 12px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);
    background:var(--surface);cursor:pointer;
  }
  input[type="file"]::file-selector-button{
    font:inherit;font-weight:650;font-size:.85rem;margin-right:12px;
    padding:7px 13px;border:1px solid var(--border-strong);border-radius:6px;cursor:pointer;
    background:var(--surface-2);color:var(--text);
  }
  input[type="file"]::file-selector-button:hover{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-600);}
  input[type="number"]{
    width:100%;font:inherit;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.88rem;
    padding:9px 11px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);
    background:var(--surface);color:var(--text);
  }
  input[type="number"]:focus,input[type="file"]:focus{outline:2px solid var(--brand-soft);outline-offset:1px;border-color:var(--brand);}
  .file-name{margin-top:8px;font-family:var(--mono);font-size:.82rem;color:var(--brand-600);}

  .choices{display:grid;gap:10px;}
  .choice{
    display:grid;grid-template-columns:auto 1fr auto;gap:13px;align-items:start;
    padding:14px 16px;border:1px solid var(--border);border-radius:var(--radius-sm);
    background:var(--surface);cursor:pointer;
  }
  .choice:hover{border-color:var(--border-strong);background:var(--surface-2);}
  .choice input[type="radio"]{margin:2px 0 0;width:17px;height:17px;accent-color:var(--brand);cursor:pointer;}
  .choice-title{display:block;font-weight:700;font-size:.92rem;}
  .choice-desc{display:block;font-size:.82rem;color:var(--text-2);margin-top:2px;}
  .choice-check{
    width:20px;height:20px;border:1px solid var(--border-strong);border-radius:50%;
    background:var(--surface);position:relative;flex:none;margin-top:1px;
  }
  .choice input[type="radio"]:checked ~ .choice-check{border-color:var(--brand);background:var(--brand);}
  .choice input[type="radio"]:checked ~ .choice-check::after{
    content:"";position:absolute;left:5px;top:4px;width:8px;height:5px;
    border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg);
  }
  .choice:has(input[type="radio"]:checked){border-color:var(--brand);background:var(--brand-soft);}
  .choice:has(input[type="radio"]:focus-visible){outline:2px solid var(--brand-soft);outline-offset:1px;}

  details.adv{border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface-2);padding:14px 16px;}
  details.adv > summary{font-weight:700;font-size:.88rem;cursor:pointer;color:var(--text-2);}
  details.adv > summary:hover{color:var(--text);}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-top:14px;}
  .grid2 .field{margin-top:0;}

  .quota{
    display:flex;align-items:center;gap:8px;margin-top:14px;
    font-size:.82rem;color:var(--text-2);
  }
  .quota::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none;}
  .quota.is-empty{color:#a52f2f;}
  .quota.is-empty::before{background:var(--err);}

  /* ---------- Monte Carlo : contexte ---------- */
  .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;}
  .fact{background:var(--surface);padding:12px 16px;}
  .fact-label{display:block;font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3);}
  .fact-value{display:block;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:1.15rem;font-weight:650;margin-top:4px;}

  /* ---------- Monte Carlo : durées ---------- */
  .durations{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  .dur{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px;
  }
  .dur-head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:20px;}
  .dur-label{font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text-3);}
  .dur-value{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:1.45rem;font-weight:650;margin-top:8px;line-height:1.1;}
  .dur-delta{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.78rem;color:var(--text-2);margin-top:4px;}
  .dur.is-target{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok-soft);}
  .dur.is-target .dur-value{color:#0f7042;}
  .dur.is-reference .dur-value{color:var(--text-2);}
  .dur.b .b{padding:2px 9px;font-size:.7rem;}

  .decision{
    border:1px solid #dbe4ff;border-left:3px solid var(--brand);border-radius:var(--radius-sm);
    background:linear-gradient(135deg,var(--brand-soft) 0%,#ffffff 85%);
    padding:16px 18px;font-size:.9rem;color:#2b3a63;
  }
  .decision strong{display:block;color:var(--brand-600);font-size:.82rem;letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px;}
  .uncertainty{margin-top:12px;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.8rem;color:var(--text-2);}

  /* ---------- Monte Carlo : criticité ---------- */
  .crit{display:grid;}
  .crit-row{
    display:grid;grid-template-columns:1fr 130px 58px;gap:14px;align-items:center;
    padding:10px 0;border-top:1px solid var(--border);font-size:.87rem;
  }
  .crit-row:first-child{border-top:0;}
  .crit-name{color:var(--text);overflow-wrap:anywhere;}
  .crit-track{display:block;height:7px;background:var(--na-soft);border-radius:999px;overflow:hidden;}
  .crit-fill{display:block;height:100%;background:var(--na);border-radius:999px;}
  .crit-fill.high{background:var(--err);}
  .crit-fill.medium{background:var(--warn);}
  .crit-fill.low{background:var(--ok);}
  .crit-pct{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;font-size:.85rem;font-weight:650;}

  /* ---------- Responsive ---------- */
  @media (max-width:820px){
    .wrap{padding:0 18px;}
    .main{padding:22px 18px 56px;}
    .card{padding:18px;}
    .kpis{grid-template-columns:repeat(3,1fr);}
    .durations{grid-template-columns:repeat(2,1fr);}
    .crit-row{grid-template-columns:1fr 90px 52px;gap:10px;}
    .brand-sub{display:none;}
  }
  @media (max-width:520px){
    body{font-size:14.5px;}
    .wrap{padding:0 14px;}
    .main{padding:18px 14px 48px;}
    .card{padding:16px;}
    .kpis{grid-template-columns:repeat(2,1fr);}
    .durations{grid-template-columns:1fr;}
    .topbar-inner{min-height:58px;}
    .crit-row{grid-template-columns:1fr auto;gap:6px 10px;}
    .crit-track{grid-column:1 / -1;order:3;}
    .prio{grid-template-columns:1fr;gap:6px;}
    .prio-num{font-size:.9rem;}
    .doc-title{align-items:flex-start;}
  }

  /* ---------- Impression ---------- */
  @media print{
    body{background:#fff;font-size:11pt;}
    .topbar,form,.btn,.head-actions,.no-print{display:none !important;}
    .main{padding:0;}
    .wrap{max-width:none;padding:0;}
    .card{border:none;box-shadow:none;padding:0;margin:0 0 18px;}
    .kpis,.durations{grid-template-columns:repeat(4,1fr);}
    details.raw{display:none;}
    .table-wrap{overflow:visible;}
    table.tbl{min-width:0;}
    a{color:inherit;text-decoration:none;}
    .c,.kpi,.dur,.facts{break-inside:avoid;}
  }
</style>
</head>
<body>

<svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
  <symbol id="i-info" viewBox="0 0 16 16">

<main class="wrap main">
  {% block content %}{% endblock %}
</main>
