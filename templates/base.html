<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>{% block title %}MPPCR — MS Project Check &amp; Risk{% endblock %}</title>
<style>
  /* ============ DESIGN TOKENS ============ */
  :root{
    --bg:#f6f7f9;
    --surface:#ffffff;
    --surface-2:#fbfcfd;
    --border:#e3e6ea;
    --border-strong:#d0d4da;

    --text:#16181d;
    --text-2:#4b5563;
    --text-3:#8a94a3;

    --brand:#2456e6;
    --brand-600:#1c46c4;
    --brand-soft:#eef3ff;

    --ok:#1a9e5c;
    --ok-soft:#e6f7ee;
    --warn:#c77d0a;
    --warn-soft:#fdf3e3;
    --err:#d14343;
    --err-soft:#fdecec;
    --info:#2456e6;
    --info-soft:#eef3ff;
    --na:#8a94a3;
    --na-soft:#eef0f3;

    --radius:12px;
    --radius-sm:8px;
    --shadow-sm:0 1px 2px rgba(16,24,40,.05);
    --shadow:0 1px 3px rgba(16,24,40,.08),0 4px 16px rgba(16,24,40,.06);
    --shadow-lg:0 8px 32px rgba(16,24,40,.12);

    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:"SF Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }

  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:var(--font);
    background:var(--bg);
    color:var(--text);
    line-height:1.5;
    font-size:15px;
  }
  ::selection{background:var(--brand);color:#fff}
  code{font-family:var(--mono);font-size:.92em}

  .wrap{max-width:1080px;margin:0 auto;padding:0 24px}
  fieldset{border:0;margin:0;padding:0;min-width:0}
  legend{padding:0}

  /* ============ HEADER ============ */
  .topbar{
    position:sticky;top:0;z-index:40;
    background:rgba(255,255,255,.85);
    backdrop-filter:saturate(180%) blur(10px);
    -webkit-backdrop-filter:saturate(180%) blur(10px);
    border-bottom:1px solid var(--border);
  }
  .topbar-in{display:flex;align-items:center;gap:16px;height:60px}
  .brand{
    display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:-.01em;
    color:inherit;text-decoration:none;
  }
  .brand-mark{
    width:28px;height:28px;border-radius:8px;
    background:linear-gradient(135deg,var(--brand),#5b8cff);
    display:grid;place-items:center;color:#fff;font-size:12px;font-weight:800;
  }
  .brand-sub{color:var(--text-3);font-weight:500;font-size:13px;margin-left:2px}
  .topbar-actions{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:0}

  /* Barre de navigation de la maquette, en liens serveur : aucun JavaScript.
     L'onglet de la section affichée est marqué au rendu (aria-current), les
     onglets sans résultat dans cette requête sont inertes (aria-disabled). */
  .tabs{
    margin-left:auto;display:flex;gap:4px;
    background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:4px;
    overflow-x:auto;scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    border:0;background:transparent;cursor:pointer;font:inherit;font-size:13px;font-weight:600;
    color:var(--text-2);padding:7px 14px;border-radius:7px;transition:.15s;
    display:flex;align-items:center;gap:7px;
    flex:none;white-space:nowrap;text-decoration:none;
  }
  .tab .n{font-size:11px;color:var(--text-3);font-weight:700}
  .tab:hover{color:var(--text)}
  .tab[aria-selected="true"],.tab[aria-current]{
    background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm);
  }
  .tab[aria-selected="true"] .n,.tab[aria-current] .n{color:var(--brand)}
  .tab.is-off{color:var(--text-3);cursor:not-allowed;opacity:.7}
  .tab.is-off:hover{color:var(--text-3)}

  /* ============ LAYOUT ============ */
  .view{padding:36px 0 72px}
  .result + .result{margin-top:44px;padding-top:36px;border-top:1px solid var(--border)}
  .result{scroll-margin-top:78px}

  .page-head{margin-bottom:28px}
  .page-head h1{font-size:24px;letter-spacing:-.02em;font-weight:700}
  .page-head p{color:var(--text-2);margin-top:4px;font-size:14px}

  .card{
    background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);box-shadow:var(--shadow-sm);
  }
  .card + .card{margin-top:20px}
  .card + .callout{margin-top:20px}
  .card-pad{padding:22px}
  .card-head{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:16px 22px;border-bottom:1px solid var(--border);
  }
  .card-head h2{font-size:15px;font-weight:700}
  .card-head .meta{font-size:12.5px;color:var(--text-3)}
  .meta{font-size:12.5px;color:var(--text-3)}
  .mb-0{margin-bottom:0}
  .chip-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
  .badge-lg{font-size:13px;padding:8px 12px}

  /* ============ BADGES ============ */
  .badge{
    display:inline-flex;align-items:center;gap:6px;
    font-size:12px;font-weight:600;line-height:1;padding:5px 9px;border-radius:999px;
    white-space:nowrap;
  }
  .badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
  .b-ok{background:var(--ok-soft);color:var(--ok)}
  .b-err{background:var(--err-soft);color:var(--err)}
  .b-warn{background:var(--warn-soft);color:var(--warn)}
  .b-info{background:var(--info-soft);color:var(--info)}
  .b-na{background:var(--na-soft);color:var(--na)}
  .b-neutral{background:var(--na-soft);color:var(--text-2)}

  /* ============ FORM ============ */
  .field{margin-bottom:22px}
  .field > label,.field > .flabel{display:block;font-size:13px;font-weight:600;margin-bottom:8px;color:var(--text)}
  .hint{font-size:12.5px;color:var(--text-3);margin-top:6px}

  .drop{
    position:relative;border:1.5px dashed var(--border-strong);border-radius:var(--radius);
    padding:34px 24px;text-align:center;cursor:pointer;transition:.18s;background:var(--surface-2);
  }
  .drop:hover,.drop:focus-within{border-color:var(--brand);background:var(--brand-soft)}
  .drop.drag{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 0 0 4px rgba(36,86,230,.12)}
  .drop .ic{width:42px;height:42px;margin:0 auto 12px;border-radius:12px;background:var(--brand-soft);display:grid;place-items:center}
  .drop .ic svg{width:20px;height:20px;stroke:var(--brand)}
  .drop .t1{font-weight:600;font-size:14px}
  .drop .t1 .link{color:var(--brand);text-decoration:underline;text-underline-offset:2px}
  .drop .t2{font-size:12.5px;color:var(--text-3);margin-top:3px}
  .drop input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
  .drop .fname{margin-top:10px;font-size:13px;color:var(--brand);font-weight:600;display:none}
  .drop.hasfile .fname{display:block}

  .choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .choice{position:relative}
  .choice input{position:absolute;opacity:0;pointer-events:none}
  .choice label{
    display:flex;flex-direction:column;gap:6px;cursor:pointer;
    border:1.5px solid var(--border);border-radius:var(--radius);padding:16px;
    transition:.15s;background:var(--surface);height:100%;
  }
  .choice label:hover{border-color:var(--border-strong);box-shadow:var(--shadow-sm)}
  .choice .ct{font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px}
  .choice .cd{font-size:12.5px;color:var(--text-3);line-height:1.45}
  .choice .tick{
    width:16px;height:16px;border-radius:5px;border:1.5px solid var(--border-strong);
    display:inline-grid;place-items:center;flex:none;transition:.15s;background:var(--surface);
  }
  .choice input:checked + label{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 0 0 3px rgba(36,86,230,.14)}
  .choice input:checked + label .tick{background:var(--brand);border-color:var(--brand)}
  .choice input:checked + label .tick svg{opacity:1}
  .choice input:focus-visible + label{outline:2px solid var(--brand);outline-offset:2px}
  .choice .tick svg{width:10px;height:10px;stroke:#fff;stroke-width:3;opacity:0}

  details.adv{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface-2);margin-bottom:22px}
  details.adv summary{
    cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;
    padding:13px 16px;font-size:13px;font-weight:600;color:var(--text-2);
  }
  details.adv summary::-webkit-details-marker{display:none}
  details.adv summary .chev{transition:.18s;display:inline-flex}
  details.adv[open] summary .chev{transform:rotate(90deg)}
  details.adv .adv-body{padding:4px 16px 18px;border-top:1px solid var(--border);margin-top:-1px;padding-top:16px}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .grid4 label{font-size:12px;font-weight:600;display:block;margin-bottom:6px}

  .in{
    width:100%;font:inherit;font-size:14px;color:var(--text);
    border:1px solid var(--border-strong);border-radius:var(--radius-sm);
    padding:9px 12px;background:var(--surface);transition:.15s;
  }
  .in:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(36,86,230,.14)}
  .in::placeholder{color:var(--text-3)}
  .in-file{padding:7px 10px;font-size:12.5px}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    font:inherit;font-size:14px;font-weight:600;cursor:pointer;
    background:var(--brand);color:#fff;border:0;border-radius:var(--radius-sm);
    padding:12px 22px;transition:.15s;box-shadow:var(--shadow-sm);text-decoration:none;
  }
  .btn:hover{background:var(--brand-600)}
  .btn:active{transform:translateY(1px)}
  .btn-block{width:100%}
  .btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  .btn-ghost{background:var(--surface);color:var(--text-2);border:1px solid var(--border);box-shadow:none;padding:8px 14px;font-size:13px}
  .btn-ghost:hover{background:var(--surface-2);border-color:var(--border-strong);color:var(--text)}

  .quota{
    display:flex;align-items:center;justify-content:center;gap:8px;
    margin-top:16px;font-size:12.5px;color:var(--text-3);
  }
  .quota .pulse{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(26,158,92,.5);animation:pulse 2s infinite}
  .quota.is-empty .pulse{background:var(--err);animation:none;box-shadow:none}
  @keyframes pulse{70%{box-shadow:0 0 0 7px rgba(26,158,92,0)}100%{box-shadow:0 0 0 0 rgba(26,158,92,0)}}

  /* ============ RESULT HEADER ============ */
  .result-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
  .file-chip{
    display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;
    background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 12px;color:var(--text-2);
    font-family:var(--mono);font-variant-numeric:tabular-nums;
  }
  .file-chip svg{width:15px;height:15px;stroke:var(--text-3);flex:none}

  /* ============ KPI CARDS ============ */
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}
  .kpi{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px 18px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;
  }
  .kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--kc,var(--border-strong))}
  .kpi .kl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3)}
  .kpi .kv{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums}
  .kpi-ok{--kc:var(--ok)} .kpi-err{--kc:var(--err)} .kpi-na{--kc:var(--na)} .kpi-info{--kc:var(--info)} .kpi-total{--kc:var(--text-3)}

  /* ============ CALLOUT ============ */
  .callout{
    display:flex;gap:12px;border-radius:var(--radius);padding:15px 17px;margin-bottom:20px;
    border:1px solid;font-size:14px;line-height:1.5;
  }
  .callout .ci{flex:none;width:20px;height:20px;margin-top:1px}
  .callout b{font-weight:600}
  .c-err{background:var(--err-soft);border-color:#f3c1c1;color:#8f2626}
  .c-warn{background:var(--warn-soft);border-color:#f0d7a8;color:#7a4c04}
  .c-info{background:var(--info-soft);border-color:#c4d4f7;color:#1c3f9e}
  .callout pre{font-family:var(--mono);font-size:12px;white-space:pre-line;margin-top:6px}

  /* ============ PRIORITIES ============ */
  .prio{display:flex;flex-direction:column}
  .prio-item{display:flex;gap:16px;padding:18px 0;border-bottom:1px solid var(--border)}
  .prio-item:last-child{border-bottom:0;padding-bottom:0}
  .prio-item:first-child{padding-top:0}
  .prio-num{
    flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
    font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;
  }
  .pn-err{background:var(--err-soft);color:var(--err)}
  .pn-na{background:var(--na-soft);color:var(--text-2)}
  .prio-body{flex:1;min-width:0}
  .prio-title{font-weight:600;font-size:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .prio-metric{font-size:13px;color:var(--text-2);margin-top:3px;font-variant-numeric:tabular-nums}
  .prio-metric .target{color:var(--text-3)}
  .prio-action{font-size:13.5px;color:var(--text-2);margin-top:8px;padding-left:11px;border-left:2px solid var(--border);line-height:1.5}

  /* ============ TABLE ============ */
  .tbl-wrap{overflow-x:auto;border-radius:var(--radius)}
  table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:680px}
  thead th{
    text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;
    color:var(--text-3);padding:11px 14px;background:var(--surface-2);border-bottom:1px solid var(--border);
    white-space:nowrap;
  }
  tbody td{padding:13px 14px;border-bottom:1px solid var(--border);vertical-align:top}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:var(--surface-2)}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .ctrl-name{font-weight:600;color:var(--text)}
  .ctrl-name .idx{color:var(--text-3);font-weight:500;margin-right:6px}
  .ctrl-sub{font-size:12px;color:var(--text-3);margin-top:2px}
  .val{font-weight:600;font-variant-numeric:tabular-nums}
  .val-sub{font-size:12px;color:var(--text-3);font-weight:400;margin-top:2px}
  .target-cell{color:var(--text-2);font-variant-numeric:tabular-nums;white-space:nowrap}
  .act{color:var(--text-2);font-size:13px;line-height:1.45;max-width:300px}
  .ids{font-family:var(--mono);font-size:12.5px;color:var(--text-2);max-width:190px;overflow-wrap:anywhere}
  .ids .val-sub{display:inline;margin-top:0}

  /* ============ RAW OUTPUT ============ */
  details.raw{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface-2);margin-top:20px}
  details.raw summary{cursor:pointer;padding:13px 16px;font-size:13px;font-weight:600;color:var(--text-2);list-style:none;display:flex;align-items:center;gap:8px}
  details.raw summary::-webkit-details-marker{display:none}
  details.raw pre{
    padding:16px;overflow-x:auto;font-family:var(--mono);font-size:12px;line-height:1.55;
    border-top:1px solid var(--border);background:#0f1420;color:#c7d0e0;border-radius:0 0 var(--radius) var(--radius);
    white-space:pre-wrap;word-break:break-word;
  }
  .card-raw{padding:0 22px 22px}
  .card-raw details.raw{margin-top:0}

  /* ============ SCORE DE CONFORMITÉ (propre au rendu serveur) ============ */
  .score{margin-bottom:20px}
  .score-head{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
  .score-value{
    font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1;
    font-variant-numeric:tabular-nums;white-space:nowrap;
  }
  .score-value small{font-size:15px;font-weight:600;color:var(--text-3);margin-left:2px}
  .score-body{flex:1;min-width:0}
  .score-title{font-size:14px;font-weight:600;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .score-meta{font-size:13px;color:var(--text-2);margin-top:4px;font-variant-numeric:tabular-nums}
  .score-track{height:10px;border-radius:99px;background:var(--na-soft);overflow:hidden;margin-top:16px}
  .score-fill{height:100%;border-radius:99px;background:var(--fc,var(--brand))}
  .score details.adv{margin:16px 0 0}
  .score details.adv .hint + .hint{margin-top:10px}

  /* ============ ATTENTE ET ARRÊT (propre au rendu serveur) ============ */
  .choices.is-pair{grid-template-columns:repeat(2,1fr)}
  .overlay{
    position:fixed;inset:0;z-index:80;background:rgba(22,24,29,.45);
    display:grid;place-items:center;padding:24px;
  }
  .overlay[hidden]{display:none}
  .overlay-card{max-width:470px;width:100%;margin:0;text-align:center}
  .overlay-spin{
    width:34px;height:34px;margin:2px auto 14px;border-radius:50%;
    border:3px solid var(--border);border-top-color:var(--brand);
    animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .overlay-title{font-size:15px;font-weight:700;margin-bottom:6px}
  .overlay-step{font-size:13px;color:var(--text-2);margin-top:4px}
  .overlay-card .btn{margin-top:16px}
  .overlay-card .hint{text-align:left}

  /* ============ MONTE CARLO ============ */
  .facts{display:flex;gap:26px;flex-wrap:wrap;font-size:13px;color:var(--text-2)}
  .facts b{color:var(--text);font-variant-numeric:tabular-nums}

  .dur-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:8px}
  .dur{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px;position:relative;box-shadow:var(--shadow-sm);
  }
  .dur .dl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3)}
  .dur .dv{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:7px;font-variant-numeric:tabular-nums}
  .dur .dv small{font-size:13px;font-weight:600;color:var(--text-3);margin-left:2px}
  .dur .dd{font-size:12px;color:var(--text-3);margin-top:5px;font-variant-numeric:tabular-nums}
  .dur .rec{
    position:absolute;top:12px;right:12px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
    background:var(--ok-soft);color:var(--ok);padding:3px 8px;border-radius:999px;
  }
  .dur.is-rec{border-color:var(--ok);box-shadow:0 0 0 3px rgba(26,158,92,.12)}

  /* échelle visuelle des percentiles */
  .scale{margin:26px 4px 8px;position:relative;padding-top:34px;height:74px}
  .scale-track{position:absolute;left:0;right:0;top:44px;height:6px;border-radius:99px;background:linear-gradient(90deg,#dfe4ea,#eef1f5)}
  .scale-fill{position:absolute;left:0;top:44px;height:6px;border-radius:99px;background:linear-gradient(90deg,var(--brand),#7aa2ff)}
  .scale-mark{position:absolute;top:26px;transform:translateX(-50%);text-align:center}
  .scale-mark .pin{width:2px;height:26px;background:var(--border-strong);margin:0 auto}
  .scale-mark .ml{font-size:10.5px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;position:absolute;top:-16px;left:50%;transform:translateX(-50%);white-space:nowrap}
  .scale-mark .mv{font-size:11.5px;color:var(--text-2);margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .scale-mark.mk-cpm .pin{background:var(--text-3)}
  .scale-mark.mk-p80 .pin{background:var(--ok);height:34px;top:-4px}
  .scale-mark.mk-p80 .ml{color:var(--ok)}

  /* barres de criticité */
  .crit{display:flex;flex-direction:column;gap:13px}
  .crit-row{display:grid;grid-template-columns:minmax(180px,300px) 1fr 64px;gap:14px;align-items:center}
  .crit-name{font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .crit-bar{height:10px;border-radius:99px;background:var(--na-soft);overflow:hidden}
  .crit-fill{height:100%;border-radius:99px;background:var(--fc,var(--brand))}
  .cf-high{--fc:var(--err)} .cf-med{--fc:var(--warn)} .cf-low{--fc:var(--ok)}
  .crit-val{font-size:13px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
  .cv-high{color:var(--err)} .cv-med{color:var(--warn)} .cv-low{color:var(--text-2)}
  .crit-note{font-size:12px;color:var(--text-3);margin-top:16px;display:flex;align-items:center;gap:8px}

  .decision{
    display:flex;gap:14px;background:linear-gradient(135deg,#f0f5ff,#f7faff);
    border:1px solid #cddcff;border-radius:var(--radius);padding:18px 20px;margin-top:22px;
  }
  .decision .di{flex:none;width:22px;height:22px;stroke:var(--brand);margin-top:1px}
  .decision .dt{font-weight:600;font-size:14px;color:#17337e;margin-bottom:3px}
  .decision .db{font-size:13.5px;color:#2a3f6e;line-height:1.55}
  .decision b{color:#17337e}

  /* ============ RESPONSIVE ============ */
  @media (max-width:820px){
    .kpis{grid-template-columns:repeat(2,1fr)}
    .kpi-total{grid-column:1/-1}
    .choices{grid-template-columns:1fr}
    .grid4{grid-template-columns:repeat(2,1fr)}
    .dur-grid{grid-template-columns:repeat(2,1fr)}
    .crit-row{grid-template-columns:1fr;gap:6px}
    .crit-val{text-align:left}
    .brand-sub{display:none}
    .scale{display:none}
    .tabs{overflow-x:auto}
  }
  @media (max-width:520px){
    .grid4,.kpis,.dur-grid{grid-template-columns:1fr}
    .wrap{padding:0 16px}
    .view{padding:24px 0 56px}
    .topbar-in{gap:10px}
    .score-value{font-size:28px}
    .score-head{gap:14px}
    .tab{padding:6px 10px;font-size:12.5px;gap:5px}
    .tab .n{font-size:10px}
  }

  /* ============ PRINT ============ */
  @media print{
    .topbar,.btn,.drop,details.raw summary,.no-print,.overlay{display:none!important}
    body{background:#fff}
    .view{padding:0}
    .card{box-shadow:none;border:1px solid #ccc;break-inside:avoid}
    .result + .result{margin-top:24px;padding-top:20px}
    table{min-width:0}
    .tbl-wrap{overflow:visible}
    .kpis,.dur-grid{grid-template-columns:repeat(4,1fr)}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap topbar-in">
    <a class="brand" href="{{ url_for('index') }}">
      <span class="brand-mark">M</span>
      MPPCR
      <span class="brand-sub">MS Project Check &amp; Risk</span>
    </a>
    <div class="topbar-actions">
      <nav class="tabs" aria-label="Sections">
      {% block tabs %}
        <span class="tab" aria-current="page"><span class="n">①</span> Formulaire</span>
        <span class="tab is-off" aria-disabled="true" title="Lancez une analyse pour obtenir ce résultat"><span class="n">②</span> Résultat DCMA-14</span>
        <span class="tab is-off" aria-disabled="true" title="Lancez une analyse pour obtenir ce résultat"><span class="n">③</span> Résultat Monte Carlo</span>
      {% endblock %}
      </nav>
    </div>
  </div>
</header>

<main class="wrap">
  {% block content %}{% endblock %}
</main>

</body>
</html>
