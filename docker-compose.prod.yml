services:
  mppcr:
    # Pinner une version en production, jamais :latest.
    image: ghcr.io/drixouuk/mppcr:v1.4.0
    container_name: mppcr
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - ANALYSIS_TIMEOUT=300  # un fichier pathologique est coupé au bout de 5 min
      - DAILY_ANALYSIS_LIMIT=5   # analyses autorisées par IP et par jour
      - MAX_CONCURRENT_ANALYSES=2  # deux analyses de front, soit deux JVM de 1,5 Go
      - MAX_UPLOAD_MB=20            # taille maximale du planning accepté
      # Mémoire allouée à la JVM d'analyse : à augmenter si vous acceptez de gros
      # plannings et disposez de la mémoire (1,5 Go ici par analyse ; garder le
      # total sous le plafond du conteneur, sinon le noyau tue la JVM).
      - JAVA_TOOL_OPTIONS=-Xmx1536m -XX:MaxMetaspaceSize=256m -XX:+UseSerialGC -XX:ActiveProcessorCount=1 -XX:+ExitOnOutOfMemoryError
    # Conteneur plafonné à 5 Go (deux analyses simultanées de 1,5 Go tiennent
    # dedans) et sacrifiable : en cas de manque, le noyau tue cette analyse
    # plutôt qu'un service voisin.
    mem_limit: 5g
    memswap_limit: 5g
    oom_score_adj: 500
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/healthz')"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    # Pas de volume : les .mpp sont traités dans un répertoire temporaire
    # supprimé en fin de requête, et usage.db vit dans la couche writable du
    # conteneur (réinitialisé à chaque rebuild — comportement voulu).
