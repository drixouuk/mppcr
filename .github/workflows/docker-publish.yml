name: Build, test & publish image

# Build multi-architecture (amd64 + arm64) de l'image MPPCR, testée puis
# publiée sur GitHub Container Registry.
#
# Runners natifs : ubuntu-24.04 (amd64) et ubuntu-24.04-arm (arm64). Les runners
# ARM64 sont gratuits pour les dépôts publics ; si le dépôt devenait privé sans
# runners ARM, remplacer ubuntu-24.04-arm par ubuntu-24.04 et ajouter
# docker/setup-qemu-action (voir README, section « Publication de l'image »).

on:
  push:
    branches: [main]
    tags: ['v*']

# Déclarées au niveau du workflow : sans packages: write, le push vers GHCR
# échoue silencieusement.
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ------------------------------------------------------------------
  # 1. Build natif sur chaque architecture + smoke test de l'image.
  # ------------------------------------------------------------------
  test:
    name: Test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (native ${{ matrix.arch }})
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: mppcr:test
          cache-from: type=gha,scope=test-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=test-${{ matrix.arch }}

      - name: Créer un planning de test
        run: |
          set -euo pipefail
          # Projet MSPDI minimal, lu par MPXJ, pour exercer la chaîne complète
          # (scripts JVM + parsing + score + exports) sans embarquer de .mpp.
          cat > /tmp/planning.mpp <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <Project xmlns="http://schemas.microsoft.com/project">
            <Name>Planning de test CI</Name>
            <StatusDate>2026-10-05T08:00:00</StatusDate>
            <StartDate>2026-09-01T08:00:00</StartDate>
            <FinishDate>2026-11-30T17:00:00</FinishDate>
            <MinutesPerDay>480</MinutesPerDay>
            <Tasks>
              <Task><UID>1</UID><ID>1</ID><Name>Analyse</Name><Duration>PT80H0M0S</Duration>
                <DurationFormat>7</DurationFormat><Start>2026-09-01T08:00:00</Start>
                <Finish>2026-09-14T17:00:00</Finish><PercentComplete>100</PercentComplete>
                <Summary>0</Summary><Milestone>0</Milestone><ConstraintType>0</ConstraintType>
                <Baseline><Number>0</Number><Duration>PT80H0M0S</Duration></Baseline></Task>
              <Task><UID>2</UID><ID>2</ID><Name>Conception</Name><Duration>PT64H0M0S</Duration>
                <DurationFormat>7</DurationFormat><Start>2026-09-15T08:00:00</Start>
                <Finish>2026-09-24T17:00:00</Finish><PercentComplete>50</PercentComplete>
                <Summary>0</Summary><Milestone>0</Milestone><ConstraintType>0</ConstraintType>
                <Baseline><Number>0</Number><Duration>PT64H0M0S</Duration></Baseline>
                <PredecessorLink><PredecessorUID>1</PredecessorUID><Type>1</Type><LinkLag>0</LinkLag></PredecessorLink></Task>
              <Task><UID>3</UID><ID>3</ID><Name>Developpement</Name><Duration>PT160H0M0S</Duration>
                <DurationFormat>7</DurationFormat><Start>2026-09-25T08:00:00</Start>
                <Finish>2026-10-22T17:00:00</Finish><PercentComplete>20</PercentComplete>
                <Summary>0</Summary><Milestone>0</Milestone><ConstraintType>0</ConstraintType>
                <Baseline><Number>0</Number><Duration>PT160H0M0S</Duration></Baseline>
                <PredecessorLink><PredecessorUID>2</PredecessorUID><Type>1</Type><LinkLag>0</LinkLag></PredecessorLink></Task>
              <Task><UID>4</UID><ID>4</ID><Name>Recette</Name><Duration>PT32H0M0S</Duration>
                <DurationFormat>7</DurationFormat><Start>2026-10-23T08:00:00</Start>
                <Finish>2026-10-28T17:00:00</Finish><PercentComplete>0</PercentComplete>
                <Summary>0</Summary><Milestone>0</Milestone><ConstraintType>0</ConstraintType>
                <Baseline><Number>0</Number><Duration>PT32H0M0S</Duration></Baseline>
                <PredecessorLink><PredecessorUID>3</PredecessorUID><Type>1</Type><LinkLag>0</LinkLag></PredecessorLink></Task>
            </Tasks>
          </Project>
          XML
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse("/tmp/planning.mpp")
          print("planning de test valide (XML bien formé)")
          PY

      - name: Smoke test
        run: |
          set -euo pipefail
          docker run -d --name mppcr-smoke -p 5000:5000 -e DAILY_ANALYSIS_LIMIT=5 mppcr:test

          echo "--- attente de /healthz ---"
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:5000/healthz -o /tmp/healthz.txt 2>/dev/null || true
            if [ "$(cat /tmp/healthz.txt 2>/dev/null)" = "ok" ]; then
              echo "/healthz OK après ${i} tentative(s)"
              break
            fi
            if [ "$i" -eq 40 ]; then
              echo "/healthz indisponible"; docker logs mppcr-smoke; exit 1
            fi
            sleep 2
          done

          echo "--- formulaire ---"
          curl -fsS http://127.0.0.1:5000/ -o /tmp/form.html
          grep -q 'MPPCR' /tmp/form.html
          grep -q 'analyses restantes' /tmp/form.html
          grep -q 'name="analysis"' /tmp/form.html
          grep -q 'name="export"' /tmp/form.html
          grep -q 'Export des résultats (facultatif)' /tmp/form.html
          grep -q 'name="client_token"' /tmp/form.html
          grep -q 'id="waiting" hidden' /tmp/form.html
          grep -q 'id="cancel-btn"' /tmp/form.html
          grep -qE '\.mpp uniquement · [0-9]+ Mo max' /tmp/form.html

          echo "--- garde-fous mémoire de la demande ---"
          grep -q 'peuvent être refusés' /tmp/form.html
          head -c 8000000 /dev/urandom > /tmp/trop-gros.mpp
          code=$(curl -sS -o /tmp/trop-gros.html -w '%{http_code}' \
            -F "analysis=dcma" -F "mpp_file=@/tmp/trop-gros.mpp" \
            http://127.0.0.1:5000/analyse)
          [ "$code" = "413" ] || { echo "fichier trop gros -> $code au lieu de 413"; exit 1; }
          grep -q 'Fichier trop volumineux' /tmp/trop-gros.html
          grep -q 'Mo reçus' /tmp/trop-gros.html
          grep -q 'extrait du planning' /tmp/trop-gros.html

          echo "--- garde-fous mémoire de l'image ---"
          heap=$(docker exec mppcr-smoke java -XX:+PrintFlagsFinal -version 2>/dev/null \
            | grep -oE '^ *size_t MaxHeapSize *= *[0-9]+' | grep -oE '[0-9]+$')
          [ -n "$heap" ] && [ "$heap" -lt 2147483648 ] \
            || { echo "tas JVM non borné : ${heap:-inconnu}"; exit 1; }
          echo "tas JVM maximal : $((heap / 1024 / 1024)) Mo"

          echo "--- compteur d'usage et verrou (droits d'écriture sur /app/data) ---"
          docker exec mppcr-smoke test -f /app/data/usage.db

          echo "--- analyse réelle : page web avec score ---"
          curl -fsS -o /tmp/result.html \
            -F "analysis=both" -F "sims=500" \
            -F "mpp_file=@/tmp/planning.mpp;filename=planning.mpp" \
            http://127.0.0.1:5000/analyse
          grep -q 'class="card card-pad score"' /tmp/result.html
          grep -q 'Score de conformité DCMA' /tmp/result.html
          grep -q 'Comment ce score est calculé' /tmp/result.html
          grep -q 'Lecture décisionnelle' /tmp/result.html
          tr -d '\n' < /tmp/result.html > /tmp/result-ligne.html
          grep -qE 'class="score-value">[[:space:]]*[0-9]+<' /tmp/result-ligne.html
          grep -q 'Tâches concernées (N°)' /tmp/result.html
          grep -qE 'class="ids">[[:space:]]*[0-9]' /tmp/result-ligne.html
          if grep -q 'Log4j' /tmp/result.html; then
            echo "trace Log4j dans la page"; exit 1
          fi

          echo "--- export CSV demandé en plus de la page ---"
          curl -fsS -o /tmp/result-csv.html \
            -F "analysis=dcma" -F "export=csv" \
            -F "mpp_file=@/tmp/planning.mpp;filename=planning.mpp" \
            http://127.0.0.1:5000/analyse
          grep -q 'Exports disponibles' /tmp/result-csv.html
          grep -q 'Contrôles DCMA-14\|Détail des contrôles' /tmp/result-csv.html
          python3 - <<'PY'
          import base64, re, sys
          html = open("/tmp/result-csv.html", encoding="utf-8").read()
          lien = re.search(r'href="data:text/csv;base64,([^"]+)"', html)
          if not lien:
              sys.exit("lien CSV absent de la page")
          contenu = base64.b64decode(lien.group(1))
          if not contenu.startswith(b"\xef\xbb\xbf"):
              sys.exit("BOM UTF-8 absent")
          texte = contenu.decode("utf-8-sig")
          for attendu in ("SCORE DE CONFORMITÉ", "CONTRÔLES DCMA-14",
                          "Logic (tâches sans lien amont/aval)",
                          "Tâches concernées (N° MS Project)"):
              if attendu not in texte:
                  sys.exit(f"section absente : {attendu}")
          if "<div" in texte:
              sys.exit("HTML dans le CSV")
          print(f"CSV OK ({len(contenu)} octets)")
          PY

          echo "--- export Excel demandé en plus de la page ---"
          curl -fsS -o /tmp/result-xlsx.html \
            -F "analysis=both" -F "export=xlsx" -F "sims=500" \
            -F "mpp_file=@/tmp/planning.mpp;filename=planning.mpp" \
            http://127.0.0.1:5000/analyse
          python3 - <<'PY'
          import base64, io, re, sys, zipfile
          html = open("/tmp/result-xlsx.html", encoding="utf-8").read()
          lien = re.search(
              r'href="data:application/vnd\.openxmlformats-officedocument'
              r'\.spreadsheetml\.sheet;base64,([^"]+)"', html)
          if not lien:
              sys.exit("lien Excel absent de la page")
          classeur = base64.b64decode(lien.group(1))
          if classeur[:2] != b"PK":
              sys.exit("classeur invalide")
          with zipfile.ZipFile(io.BytesIO(classeur)) as archive:
              feuilles = archive.read("xl/workbook.xml").decode("utf-8")
          if "Contrôles DCMA-14" not in feuilles or "Monte Carlo" not in feuilles:
              sys.exit("feuilles attendues absentes")
          print(f"XLSX OK ({len(classeur)} octets)")
          PY

          echo "--- arrêt d'analyse ---"
          jeton=$(python3 -c "import secrets; print(secrets.token_hex(16))")
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "http://127.0.0.1:5000/annuler/$jeton")
          [ "$code" = "404" ] || { echo "annuler/inexistant -> $code au lieu de 404"; exit 1; }
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "http://127.0.0.1:5000/annuler/zzz")
          [ "$code" = "400" ] || { echo "annuler/jeton invalide -> $code au lieu de 400"; exit 1; }

          echo "--- HEALTHCHECK de l'image ---"
          for i in $(seq 1 20); do
            status=$(docker inspect --format '{{.State.Health.Status}}' mppcr-smoke)
            if [ "$status" = "healthy" ]; then echo "conteneur healthy"; break; fi
            if [ "$i" -eq 20 ]; then echo "status=$status"; docker logs mppcr-smoke; exit 1; fi
            sleep 5
          done

          docker logs mppcr-smoke
          docker rm -f mppcr-smoke

  # ------------------------------------------------------------------
  # 2. Construction et push par architecture (une image par digest).
  # ------------------------------------------------------------------
  publish:
    name: Publish (${{ matrix.arch }})
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=build-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.arch }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ------------------------------------------------------------------
  # 3. Assemblage du manifeste multi-arch et application des tags.
  # ------------------------------------------------------------------
  merge:
    name: Merge manifests
    needs: publish
    runs-on: ubuntu-24.04

    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            $(jq -r '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

  # ------------------------------------------------------------------
  # 4. Release GitHub automatique sur tag v*.
  # ------------------------------------------------------------------
  release:
    name: GitHub Release
    needs: merge
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "La release $GITHUB_REF_NAME existe déjà."
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
