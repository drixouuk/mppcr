services:
  mpp:
    build: .
    container_name: mpp
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      ANALYSIS_TIMEOUT: "900"
      DAILY_ANALYSIS_LIMIT: "5"
      MAX_CONCURRENT_ANALYSES: "2"
      MAX_UPLOAD_MB: "5"          # taille maximale du planning accepté
      # Mémoire allouée à chaque analyse (valeur de l'image, ajustable ici) :
      # 768 Mo suffisent pour un planning courant, l'analyse échoue proprement
      # au-delà plutôt que d'épuiser la mémoire du serveur.
      JAVA_TOOL_OPTIONS: "-Xmx768m -XX:MaxMetaspaceSize=192m -XX:+UseSerialGC -XX:ActiveProcessorCount=1 -XX:+ExitOnOutOfMemoryError"
    # Garde-fous mémoire : le conteneur ne peut pas affamer les services voisins
    # de la machine, et c'est lui que le noyau tue en premier en cas de manque.
    mem_limit: 3g
    memswap_limit: 3g
    oom_score_adj: 500
